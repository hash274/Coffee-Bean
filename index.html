<style>
:root{--bg:#E5E3CE;--fg:#2A1A12;--ln:rgba(42,26,18,.16);--ca:#B85A22;padding-top:env(safe-area-inset-top,0px)}

html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font:18px/1.65 Geist,system-ui,sans-serif;overflow-x:hidden}

#cv{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main,header,footer{position:relative;z-index:1}
.c{max-width:1280px;margin:auto;padding-inline:clamp(20px,4vw,56px)}
h1,h2,.big,.wm{font-family:Geist,system-ui,sans-serif;font-weight:600}
h1{font-size:clamp(46px,9.4vw,146px);line-height:1;letter-spacing:-.03em}
h2{font-size:clamp(34px,5vw,72px);line-height:1.05;letter-spacing:-.02em;margin-bottom:26px}
.ln{display:block;overflow:hidden;padding:.08em 0 .1em;margin:-.08em 0 -.1em}
.ln>span{display:block}
.js .ln>span{transform:translateY(110%);transition:transform 1.1s cubic-bezier(.32,.72,0,1)}
.js .in .ln>span,.js .ln.in>span{transform:none}
header{position:fixed;z-index:30;top:14px;left:50%;transform:translateX(-50%);width:min(1120px,calc(100% - 28px));height:62px;border-radius:999px;border:1px solid var(--ln);background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 24px 48px -28px rgba(42,26,18,.35)}
header .c{height:100%;display:flex;align-items:center;gap:22px;padding-inline:26px 9px}
.logo{font:600 20px Geist,'Inter Tight',system-ui,sans-serif;letter-spacing:-.01em;color:inherit;text-decoration:none;margin-right:auto}
nav{display:flex;gap:22px}
nav a,.lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:inherit;text-decoration:none;opacity:.75}
nav a:hover{opacity:1}
.tg{display:flex;gap:4px;font-size:11px;letter-spacing:.1em}
.tg button,.ic{background:none;border:0;color:inherit;font:inherit;cursor:pointer;opacity:.5;padding:4px}
.tg{gap:0;border:1px solid var(--ln);border-radius:999px;padding:3px;font-size:12px}.tg button{border-radius:999px;padding:6px 12px}.tg button.on{opacity:1;background:var(--fg);color:var(--bg)}
.ic{opacity:.9;display:grid;place-items:center;border:1px solid var(--ln);width:40px;height:40px}
.btn{position:relative;overflow:hidden;isolation:isolate;display:inline-flex;align-items:center;gap:18px;height:56px;padding:0 8px 0 28px;border:1px solid var(--ln);border-radius:999px;background:none;color:inherit;font:500 15px Geist,system-ui,sans-serif;cursor:pointer;white-space:nowrap;text-decoration:none;transition:color .5s,border-color .5s,transform .5s cubic-bezier(.32,.72,0,1)}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--ca);transform:translateY(101%);transition:transform .7s cubic-bezier(.32,.72,0,1)}
.btn::after{content:"";width:40px;height:40px;border-radius:50%;background:color-mix(in srgb,currentColor 12%,transparent);transition:transform .5s cubic-bezier(.32,.72,0,1)}.btn i.a{display:none}
.btn:hover{color:#fff;border-color:var(--ca)}.btn:hover::before{transform:none}.btn:hover::after{transform:translateX(3px) scale(1.06)}.btn:active{transform:scale(.97)}
.btn.find,form .btn{background:var(--fg);color:var(--bg);border-color:var(--fg)}.btn.find:hover,form .btn:hover{color:#fff;border-color:var(--ca)}
header .btn{height:44px;padding:0 6px 0 20px;font-size:14px;gap:12px}header .btn::after{width:32px;height:32px}
.lead{font:400 clamp(20px,2.2vw,28px)/1.4 Geist,system-ui,sans-serif;letter-spacing:-.015em;max-width:30ch}
::selection{background:var(--ca);color:#fff}
section{position:relative;overflow:hidden;padding-block:clamp(110px,15vw,210px);border-top:1px solid var(--ln)}
#hero{min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;border:0;padding-block:120px 0}
#hero .c{width:100%}
.lbl{display:inline-block;margin-bottom:30px;padding:8px 16px;border:1px solid var(--ln);border-radius:999px}
.gh{position:absolute;left:clamp(20px,4vw,56px);bottom:1vw;font:600 clamp(140px,26vw,380px)/.8 Geist,'Inter Tight',system-ui,sans-serif;letter-spacing:-.05em;color:transparent;-webkit-text-stroke:1px var(--ln);pointer-events:none;white-space:nowrap}
.col{max-width:min(54%,660px);position:relative}
p{max-width:52ch}p+p{margin-top:14px}
.hb{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;flex-wrap:wrap;margin-top:34px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.str{display:grid;grid-template-columns:repeat(3,1fr);margin-top:56px;border-top:1px solid var(--ln)}
.str div{padding:20px 20px 28px 0}
.str b{font:600 clamp(30px,4vw,54px)/1 Geist,'Inter Tight',system-ui,sans-serif;letter-spacing:-.02em;display:block;margin-bottom:6px}
.str span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.ten{font:600 clamp(120px,18vw,260px)/.9 Geist,'Inter Tight',system-ui,sans-serif;letter-spacing:-.04em;display:flex;align-items:baseline;gap:14px;margin-bottom:28px}
.ten small{font:500 14px Inter;letter-spacing:.1em;text-transform:uppercase}
.st{display:grid;grid-template-columns:70px 1fr;padding-block:7vh;border-top:1px solid var(--ln);opacity:.28;transition:opacity .6s;max-width:720px}
.st.on{opacity:1}
.st .big{font-size:clamp(52px,8vw,112px);line-height:1;letter-spacing:-.03em}

.tb{max-width:560px;margin-top:30px}
.tb div{display:flex;justify-content:space-between;gap:20px;padding:14px 0;border-top:1px solid var(--ln)}
.tb span:first-child{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.mn{columns:2;column-gap:56px;max-width:820px;margin-top:30px}
.mi{break-inside:avoid;padding:14px 0;display:flex;align-items:baseline;gap:10px;font:500 24px Geist,'Inter Tight',system-ui,sans-serif;letter-spacing:-.01em;transition:color .3s,padding .3s;cursor:default}
.mi:hover{color:var(--ca);padding-left:12px}
.mi i{flex:1;border-bottom:1px dotted var(--ln)}
.mi b{font-weight:500;font-size:20px}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,72px);align-items:start}
.map{position:relative;aspect-ratio:1.46;border:1px solid var(--ln);border-radius:22px;box-shadow:0 0 0 9px color-mix(in srgb,var(--fg) 5%,transparent),0 40px 80px -40px rgba(42,26,18,.35);background-image:linear-gradient(var(--ln) 1px,transparent 1px),linear-gradient(90deg,var(--ln) 1px,transparent 1px);background-size:12.5% 16.6%}
.mc{position:absolute;font-size:10px;letter-spacing:.08em;opacity:.55;padding:4px 6px}
.d{position:absolute;width:14px;height:14px;margin:-7px;border:1.5px solid var(--fg);background:var(--bg);border-radius:50%;cursor:pointer;padding:0;color:inherit}
.d span{position:absolute;left:20px;top:-3px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.d.on{background:var(--ca);border-color:var(--ca)}
.d.on::after{content:"";position:absolute;inset:-2px;border:1.5px solid var(--ca);border-radius:50%;animation:rp 1.8s ease-out infinite}
@keyframes rp{to{transform:scale(4);opacity:0}}
.r{display:grid;grid-template-columns:36px 1fr auto auto;gap:16px;align-items:center;padding:20px 0 20px 14px;border-top:1px solid var(--ln);border-left:2px solid transparent;cursor:pointer;transition:padding .3s}
.r:hover{padding-left:24px}
.r.on{border-left-color:var(--ca)}
.r .big{font-size:28px}.r small{display:block;opacity:.7;font-size:14px}
.r a{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:inherit}
#msg,#co{margin-top:14px;min-height:24px;font-size:14px}
#co{margin-top:18px;font:500 12px Inter;letter-spacing:.1em;opacity:.8}
.mail{font:600 clamp(22px,3vw,38px) Geist,'Inter Tight',system-ui,sans-serif;color:inherit;display:inline-block;margin-top:22px;letter-spacing:-.01em}
form{display:grid;gap:22px;max-width:560px;margin-top:34px}
input,textarea{background:none;border:0;border-bottom:1px solid var(--ln);color:inherit;font:inherit;padding:10px 0;width:100%;outline:0}
input:focus,textarea:focus{border-color:var(--ca)}
label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.7;display:block}
footer{padding-top:48px;border-top:1px solid var(--ln);font-size:13px;overflow:hidden}

.wm{font-size:clamp(56px,14.5vw,210px);line-height:.8;letter-spacing:-.05em;margin:40px 0 -.04em;white-space:nowrap;text-align:center}
#rc{position:fixed;left:clamp(20px,4vw,56px);bottom:20px;z-index:9;width:190px;padding:12px 14px;border-radius:18px;background:var(--bg);border:1px solid var(--ln);box-shadow:0 20px 40px -24px rgba(42,26,18,.4);pointer-events:none;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
#rc svg{width:100%;display:block;overflow:visible}
#rc div{display:flex;justify-content:space-between;margin-top:6px}
#rc b{font:600 18px Geist,'Inter Tight',system-ui,sans-serif;letter-spacing:0}
#rs{opacity:.75;margin-top:2px}
.js .rv{opacity:0;transform:translateY(34px);filter:blur(8px);transition:opacity 1.2s cubic-bezier(.32,.72,0,1),transform 1.2s cubic-bezier(.32,.72,0,1),filter 1.2s}
.js .rv.in{opacity:1;transform:none;filter:none}
@media(max-width:900px){nav{display:none}.col{max-width:100%}.lg{grid-template-columns:1fr}.mn{columns:1}header .btn{display:none}#rc{width:auto;padding:8px 14px;border-radius:999px}#rc svg,#rs{display:none}#rc div{margin:0;gap:12px}.str span{font-size:10px}}

:root{--ca:#B85A22}
h1{font-size:clamp(34px,7.2vw,112px);letter-spacing:-.035em}h2{letter-spacing:-.03em}

.lead{margin-top:28px}.row{margin-top:36px}

.core{border-radius:24px;padding:30px;background:color-mix(in srgb,var(--fg) 7%,var(--bg));box-shadow:inset 0 1px 1px rgba(255,255,255,.35),0 28px 50px -32px rgba(40,22,12,.4);height:100%}

.bn{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:min(72%,880px)}
.b1{grid-column:1/3;grid-row:1/3}.b2{grid-column:3/5}.b3{grid-column:3}.b4{grid-column:4}
.k{font-size:13px;opacity:.8;display:block;margin-bottom:14px}

.b1 h2{font-size:clamp(40px,5vw,72px)}
.map{border:0;box-shadow:none;border-radius:24px;background-color:color-mix(in srgb,var(--fg) 7%,var(--bg))}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:clamp(32px,6vw,96px);align-items:start}.cg form{margin:0;max-width:none}
input,textarea{border-bottom-color:color-mix(in srgb,var(--fg) 40%,transparent)}label{opacity:.85}

.bg i{position:absolute;left:14px;right:14px;height:1.5px;background:currentColor;transition:transform .6s cubic-bezier(.32,.72,0,1)}.bg i:nth-child(1){top:18px}.bg i:nth-child(2){top:25px}

#ov{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:96px 32px 32px;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(28px);backdrop-filter:blur(28px);opacity:0;pointer-events:none;transition:opacity .6s cubic-bezier(.32,.72,0,1)}
.open #ov{opacity:1;pointer-events:auto}
#ov a{font:600 clamp(36px,10vw,56px)/1.15 Geist,system-ui,sans-serif;letter-spacing:-.03em;color:inherit;text-decoration:none;opacity:0;transform:translateY(40px);transition:opacity .7s cubic-bezier(.32,.72,0,1),transform .7s cubic-bezier(.32,.72,0,1);transition-delay:calc(var(--i)*60ms)}
.open #ov a{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}.js .rv{opacity:1;transform:none;filter:none}.js .ln>span{transform:none}}
@media(max-width:900px){.bg{display:block}.hg{max-width:none;margin:0}.bn{max-width:none;grid-template-columns:1fr 1fr}.b1{grid-column:1/3;grid-row:auto}.b2{grid-column:1/3}.b3,.b4{grid-column:auto}.cg{grid-template-columns:1fr}.st{grid-template-columns:1fr}.st p{grid-column:1}#hero .lead,#hero .row{max-width:none}}
